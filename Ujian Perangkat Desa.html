<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Perangkat Desa</title>
<style>
:root{--bg:#EEF1F5;--sf:#fff;--ink:#14202B;--mut:#5B6875;--line:#D5DBE2;--ac:#1F5FBF;--acs:#E4EEFC;--ok:#1E7A4C;--oks:#DFF3E7;--bad:#B3261E;--bads:#FBE4E2;--warn:#B26A00;--warns:#FFF0D6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F161D;--sf:#18222C;--ink:#E7EDF3;--mut:#9AA8B5;--line:#2C3947;--ac:#6FA3F2;--acs:#1B2D47;--ok:#58C98B;--oks:#16352A;--bad:#FF8F86;--bads:#3C1D1B;--warn:#F0B35A;--warns:#3A2C12}}
:root[data-theme="dark"]{--bg:#0F161D;--sf:#18222C;--ink:#E7EDF3;--mut:#9AA8B5;--line:#2C3947;--ac:#6FA3F2;--acs:#1B2D47;--ok:#58C98B;--oks:#16352A;--bad:#FF8F86;--bads:#3C1D1B;--warn:#F0B35A;--warns:#3A2C12}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:700 1.15rem/1.3 Georgia,serif;margin:0 0 10px}
p.sub{color:var(--mut);margin:0 0 18px;max-width:60ch}
.card{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec-list{display:grid;gap:8px}
.sec-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--sf);text-align:left;width:100%}
.sec-item[aria-pressed=true]{border-color:var(--ac);background:var(--acs)}
.sec-item b{flex:1}.sec-item span{color:var(--mut);font-size:.9rem}
.row{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0}
label.chk{display:flex;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--ac)}
.layout{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.qt{font:1.12rem/1.6 Georgia,serif;margin:0 0 14px;max-width:70ch}
.meta{color:var(--mut);font-size:.88rem;margin-bottom:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:var(--acs)}.opt.sel .l{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{border-color:var(--bad);background:var(--bads)}.opt.no .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.g{height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--sf);font-weight:600;font-size:.85rem}
.g.done{background:var(--ac);border-color:var(--ac);color:#fff}.g.flag{border-color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.g.cur{outline:3px solid var(--ink);outline-offset:1px}
.g.ok{background:var(--ok);border-color:var(--ok);color:#fff}.g.no{background:var(--bad);border-color:var(--bad);color:#fff}
.note{font-size:.88rem;padding:8px 10px;border-radius:8px;background:var(--warns);color:var(--ink);margin-top:8px}
.big{font:700 3rem/1 Georgia,serif}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.stats div{min-width:90px}.stats small{display:block;color:var(--mut)}
.rv{border-left:4px solid var(--line);padding-left:12px;margin-bottom:16px}.rv.ok{border-color:var(--ok)}.rv.no{border-color:var(--bad)}.rv.sk{border-color:var(--warn)}
.hide{display:none}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--ink);max-width:420px}
dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>

<script id="data" type="application/json">[{"t":"Pancasila & UUD 1945","q":[{"n":1,"q":"Demokrasi Pancasila yang termaktub dalam sila ke-4 Pancasila, dalam hal pengambilan keputusan adalah :","o":["Masalah diselesaikan dengan hati-hati","Mendahulukan kepentingan individu dan kelompok","Keputusan diambil melalui musyawarah mufakat","Keputusan diambil melalui voting","Mengutamakan pendapat pemimpin"],"l":"abcde","a":2,"i":true},{"n":2,"q":"Pancasila dimaknai sebagai way of life. Dalam hal ini Pancasila memiliki makna :","o":["Tujuan Hidup","Pegangan Hidup","Pedoman Hidup","Perjalanan Hidup","Kepribadian Hidup"],"l":"abcde","a":2,"i":true},{"n":3,"q":"Kebebasan berserikat dan Hak Asasi Manusia dijamin di dalam UUD 1945, pasal :","o":["Pasal 25","Pasal 26","Pasal 27","Pasal 28","Pasal 29"],"l":"abcde","a":3,"i":true},{"n":4,"q":"Proses peradilan terkait tindak pidana korupsi, adalah kewenangan dari .......","o":["Pengadilan negeri","Pengadilan HAM","Pengadilan TIPIKOR","Pengadilan tinggi negeri","Pengadilan Agama"],"l":"abcde","a":2,"i":true},{"n":5,"q":"Undang-Undang Republik Indonesia yang mengatur tentang Hak Asasi Manusia (HAM) adalah :","o":["UU RI No. 5 Tahun 1998","UU RI No. 26 Tahun 2000","UU RI No. 11 Tahun 2005","UU RI No. 12 Tahun 2005","UU RI No. 39 Tahun 1999"],"l":"abcde","a":4,"i":true},{"n":6,"q":"Hak dan Kewajiban Warga Negara Republik Indonesia diatur dalam :","o":["Undang-undang RI","Peraturan Pemerintah","Pembukaan UUD RI Tahun 1945","Pasal 27 s/d 34 UUD RI Tahun 1945","Pancasila sebagi satu-satunya asas"],"l":"abcde","a":4,"i":false},{"n":7,"q":"Mengutamakan kepentingan negara dan bangsa, di atas kepentingan pribadi, kelompok dan golongan untuk menjaga persatuan dan kesatuan bangsa, merupakan cerminan dari sila Pancasila, yaitu :","o":["Sila ke-1","Sila ke-2","Sila ke-3","Sila ke-4","Sila ke-5"],"l":"abcde","a":1,"i":false},{"n":8,"q":"Berkumpulnya warga dalam rangka tetangganya mendirikan rumah ditujukan untuk meningkatkan kebersamaan dan saling me karsa","Penghormatan kita terhadap orang lain yang lebih tua"],"l":"abcde","a":0,"i":false},{"n":14,"q":"Hari kesaktian pancasila jatuh pada tanggal :","o":["1 Oktober","30 September","1 Desember","30 Desember","30 Oktober"],"l":"abcde","a":0,"i":false},{"n":15,"q":"Perbedaan idiologi Pancasila dengan liberalisme di bidang politik, bahwa Pancasila mengutamakan keseimbangan antara :","o":["persamaan pendapat dan oposisi yang bersifat liberal","kepentingan masyarakat dan kebebasan individu","kebebasan partai politik dan pembatasan partai politik","sistem banyak partai dan sistem dua partai","sistem presidensial dan sistem parlementer"],"l":"abcde","a":1,"i":false},{"n":16,"q":"Sikap positif terhadap nilai - nilai pancasila adalah ...","o":["Selalu minta upah setelah melaksanakan sesuatu","Senang kalau mendapat pujian orang lain","Bersabar menerima cobaan dan pantang menyerah dalam berbagai kehidupan","Patuh dan taat pada segala perintah atasan","Selalu provokasi sebuah kebijakan pemerintah desa"],"l":"abcde","a":2,"i":false},{"n":17,"q":"Pembangunan nasional dilaksanakan untuk mewujudkan ..","o":["Cita - cita nasional","Kemajuan merata","Paradikma pembangunan","Tujuan nasional","Pembangunan kelompok etnis"],"l":"abcde","a":0,"i":false},{"n":18,"q":"Yang menjadi dasar hukum terbentuknya lembaga-lembaga peradilan nasional adalah Pancasila terutama sila ....","o":["Kesatu","Kedua","Kelima","Ketiga","Keempat"],"l":"abcde","a":2,"i":false},{"n":19,"q":"Berlaku jujur, menghargai orang lain adalah contoh-contoh prilaku yang bersumber dari norma ...","o":["Agama","Kesusilaan","Adat","Kesopanan","Hukum"],"l":"abcde","a":0,"i":false},{"n":20,"q":"Mengkonsumsi obat-obat terlarang, melakukan tindakan diskriminasi kepada orang lain adalah contoh prilaku yang bertentangan dengan aturan yang dilakukan di lingkungan ...","o":["Cita - cita nasional","Lingkungan sekolah","Lingkungan pesantren","Lingkungan bangsa dan negara","Lingkungan masyarakat"],"l":"abcde","a":3,"i":false},{"n":21, 1)"],"l":"abcde","a":0,"i":false},{"n":30,"q":"Undang-Undang Dasar 1945 mempunyai beberapa fungsi untuk Negara. Sebagai hukum tertinggi UUD 1945 berfungsi sebagai.","o":["Mengikat seluruh warga Negara","Sebagai acuan dan alat untuk mengontrol seluruh norma dan peraturan yang berlaku","Memuat tugas lembaga Negara dan pelaksanaannya","Untuk menentukan lembaga-lembaga Negara","Menentukan kehidupan Negara berikutnya."],"l":"abcde","a":1,"i":false},{"n":31,"q":"Penetapan pertama kali Undang-Undang dasar 1945 dinyatakan sebagai hokum dasar yang sah dan berlaku di Indonesia dilakukan oleh ...","o":["BPUPKI","Panitia Sembilan","PPKI","Presider","Dewan Konstituante"],"l":"abcde","a":2,"i":false},{"n":32,"q":"Setiap warga negara mempunyai kedududkan yang sama dihadapan hukum dan pemerintahan, ini menunjjukkan bahwa adamya keseimbangan antara hak dan kewajiban dan tidak adanya diskriminasi diantara warga negara yang diatur dalam UUD 1945 adalah ....","o":["Pasal 28","Pasal 30","Pasal 27","Pasal 34","Pasal 29"],"l":"abcde","a":2,"i":false},{"n":33,"q":"Membuang sampah sembarangan, merusak fasilitas negara, melanggar aturan berlalu lintas adalah merupakan kasus pelanggaran ....","o":["hak asasi manusia","hak warga neagra","kewajiban asasi manusi","kewajiban warga negara","pengingkaran kewajiban warga Negara"],"l":"abcde","a":4,"i":false},{"n":34,"q":"UUD 1945 secara resmi dinyatakan sah digunakan sebagai dasar Negara Indonesia pada tanggal","o":["01-Jun-45","16-Aug-45","18-Aug-45.","19-Aug-45","20-Aug-45"],"l":"abcde","a":2,"i":true},{"n":35,"q":"Menurut Pasal 1 UUD 1945 amandemen, MPR tidak lagi melakukan sepenuhnya kedaulatan rakyat, karena ..","o":["Kedaulatan milik bersama","Kedaulatan sepenuhnya dilakukan melalui pilpres langsung","Kedaulatan berada ditangan legislatif dan presiden/wapres","Kedaulatan berada di tangan Mahkamah Konstitusi","Kedaulatan berada di tangan rakyat"],"l":"abcde","a":4,"i":false},{"n":36,"q":"Setiap warga negara berhak mendapat pendidikan. Hal ini t <script>
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sel=new Set([0]),shuffle=false,mode='ujian',S=null,timer=null;
function fmt(s){const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){
  const total=D.reduce((a,s,i)=>a+(sel.has(i)?s.q.length:0),0);
  app.innerHTML=`<h1>Ujian Perangkat Desa</h1><p class="sub">Pilih satu atau beberapa bagian soal, lalu mulai. Jawaban dinilai otomatis di akhir.</p>
  <div class="card"><h2>Bagian soal</h2><div class="sec-list">${D.map((s,i)=>`<button class="sec-item" data-i="${i}" aria-pressed="${sel.has(i)}"><b>${esc(s.t)}</b><span>${s.q.length} soal</span></button>`).join('')}</div></div>
  <div class="card"><h2>Pengaturan</h2><div class="row">
  <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Acak urutan soal</label></div>
  <div class="row"><label class="chk"><input type="radio" name="m" value="ujian" ${mode=='ujian'?'checked':''}> Mode ujian (benar/salah tampil di akhir)</label>
  <label class="chk"><input type="radio" name="m" value="latihan" ${mode=='latihan'?'checked':''}> Mode latihan (langsung tahu benar/salah)</label></div></div>
  <button class="btn" id="go" ${total?'':'disabled'}>Mulai ujian (${total} soal)</button>`;
  app.querySelectorAll('.sec-item').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);shuffle=$('#shuf').checked;mode=app.querySelector('input[name=m]:checked').value;start()});
  $('#go').onclick=()=>{shuffle=$('#shuf').checked;mode=app.querySelector('input[name=m]:checked').value;begin()};
}
function begin(){
  let qs=[];D.forEach((s,i)=>{if(sel.has(i))s.q.forEach(q=>qs.push({...q,sec:s.t}))});
  if(shuffle)for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  S={qs,ans:Array(qs.length).fill(null),flag:Array(qs.length).fill(false),i:0,t:0};
  clearInterval(timer);timer=setInterval(()=>{S.t++;const e=$('#tm');if(e)e.textContent=fmt(S.t)},1000);
  render();
}
function render(){
  const q=S.qs[S.i],a=S.ans[S.i],locked=mode=='latihan'&&a!==null,done=S.ans.filter(x=>x!==null).length;
  app.innerHTML=`<div class="top"><strong>${esc(q.sec)}</strong><span>Waktu <b id="tm">${fmt(S.t)}</b> &nbsp; Terjawab ${done}/${S.qs.length}</span></div>
  <div class="bar"><i style="width:${done/S.qs.length*100}%"></i></div>
  <div class="layout"><div><div class="card"><div class="meta">Soal ${S.i+1} dari ${S.qs.length}</div>
  <p class="qt">${esc(q.q)}</p>
  ${q.o.map((o,k)=>{let c='opt';if(locked){if(k===q.a)c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel';
   return `<button class="${c}" data-k="${k}" ${locked?'disabled':''}><span class="l">${q.l[k].toUpperCase()}</span><span>${esc(o)}</span></button>`}).join('')}
  ${locked&&q.a===null?'<div class="note">Kunci jawaban soal ini belum tersedia.</div>':''}
  <div class="nav"><button class="btn sec" id="pv" ${S.i?'':'disabled'}>Sebelumnya</button>
  <button class="btn sec" id="fl">${S.flag[S.i]?'Hapus tanda ragu':'Tandai ragu-ragu'}</button>
  ${S.i<S.qs.length-1?'<button class="btn" id="nx">Berikutnya</button>':'<button class="btn" id="fin">Selesai</button>'}</div></div></div>
  <aside class="card"><h2>Nomor soal</h2><div class="grid">${S.qs.map((_,k)=>`<button class="g${S.ans[k]!==null?' done':''}${S.flag[k]?' flag':''}${k==S.i?' cur':''}" data-g="${k}" aria-label="Soal ${k+1}">${k+1}</button>`).join('')}</div>
  <p class="meta" style="margin-top:10px">Biru: terjawab. Garis kuning: ragu-ragu.</p><button class="btn" id="fin2" style="width:100%">Selesai &amp; lihat nilai</button></aside></div>
  <dialog id="dlg"><p id="dm"></p><div class="nav"><button class="btn sec" id="no">Kembali</button><button class="btn" id="yes">Kumpulkan</button></div></dialog>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.k;render()});
  app.querySelectorAll('.g').forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;render()});
  $('#pv').onclick=()=>{S.i--;render()};$('#fl').onclick=()=>{S.flag[S.i]=!S.flag[S.i];render()};
  if($('#nx'))$('#nx').onclick=()=>{S.i++;render()};
  const ask=()=>{const left=S.qs.length-S.ans.filter(x=>x!==null).length;$('#dm').textContent=left?`Masih ada ${left} soal belum dijawab. Kumpulkan sekarang?`:'Semua soal sudah dijawab. Kumpulkan sekarang?';$('#dlg').showModal()};
  if($('#fin'))$('#fin').onclick=ask;$('#fin2').onclick=ask;
  $('#no').onclick=()=>$('#dlg').close();$('#yes').onclick=finish;
}
function finish(){
  clearInterval(timer);
  let ok=0,no=0,sk=0,ng=0;S.qs.forEach((q,k)=>{if(q.a===null){ng++;return}S.ans[k]===null?sk++:S.ans[k]===q.a?ok++:no++});
  const g=ok+no+sk,score=g?Math.round(ok/g*100):0;
  window.review=f=>{
    const items=S.qs.map((q,k)=>({q,k,st:q.a===null?'sk':S.ans[k]===null?'sk':S.ans[k]===q.a?'ok':'no'})).filter(x=>f=='all'||(f=='bad'&&x.st!='ok'));
    $('#rv').innerHTML=items.map(({q,k,st})=>`<div class="rv ${st}"><div class="meta">Soal ${k+1} · ${st=='ok'?'Benar':S.ans[k]===null?'Tidak dijawab':'Salah'}</div><p class="qt">${esc(q.q)}</p>
    ${q.o.map((o,j)=>{let c='opt';if(j===q.a)c+=' ok';else if(j===S.ans[k])c+=' no';return `<div class="${c}"><span class="l">${q.l[j].toUpperCase()}</span><span>${esc(o)}</span></div>`}).join('')}
    ${q.a===null?'<div class="note">Kunci jawaban soal ini belum tersedia, jadi tidak dinilai.</div>':q.i?'<div class="note">Kunci soal ini tidak bertanda "," di file asli; jawabannya ditentukan Claude, mohon dicek.</div>':''}</div>`).join('')||'<p>Tidak ada soal yang salah. Mantap.</p>';
  };
  app.innerHTML=`<h1>Hasil ujian</h1><div class="card"><div class="big">${score}</div><div class="stats">
  <div><b>${ok}</b><small>Benar</small></div><div><b>${no}</b><small>Salah</small></div><div><b>${sk}</b><small>Kosong</small></div><div><b>${fmt(S.t)}</b><small>Waktu</small></div></div>
  ${ng?`<div class="note">${ng} soal tidak dinilai karena kunci jawabannya belum ada.</div>`:''}
  <div class="nav" style="justify-content:flex-start"><button class="btn" onclick="review('bad')">Lihat yang salah</button><button class="btn sec" onclick="review('all')">Lihat semua pembahasan</button><button class="btn sec" id="again">Ujian baru</button></div></div><div id="rv"></div>`;
  $('#again').onclick=start;review('bad');
}
start();
</script>
</body>
</html>
